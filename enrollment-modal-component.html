<script>
// FORCE BLACK TEXT - IMMEDIATE EXECUTION
(function() {
    'use strict';

    function forceBlackText() {
        const modal = document.getElementById('courseEnrollmentModal');
        if (!modal) return;

        // Force all labels
        modal.querySelectorAll('label').forEach(el => {
            el.style.setProperty('color', 'black', 'important');
            el.style.setProperty('font-weight', 'bold', 'important');
        });

        // Force all selects
        modal.querySelectorAll('select').forEach(el => {
            el.style.setProperty('color', 'black', 'important');
            el.style.setProperty('font-weight', 'bold', 'important');
        });

        // Force all options
        modal.querySelectorAll('option').forEach(el => {
            el.style.setProperty('color', 'black', 'important');
            el.style.setProperty('font-weight', 'bold', 'important');
        });

        // Force checkbox span
        modal.querySelectorAll('.checkbox-label span').forEach(el => {
            el.style.setProperty('color', 'black', 'important');
            el.style.setProperty('font-weight', 'bold', 'important');
        });

        // Force textarea
        modal.querySelectorAll('textarea').forEach(el => {
            el.style.setProperty('color', 'black', 'important');
        });
    }

    // Execute immediately
    forceBlackText();

    // Execute after short delay
    setTimeout(forceBlackText, 50);
    setTimeout(forceBlackText, 200);
    setTimeout(forceBlackText, 500);
})();
</script>
