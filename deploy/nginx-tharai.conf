# THARAI EduTech — Nginx site config
# Serves the static frontend directly and proxies /api/* to the Flask
# backend (gunicorn, running on 127.0.0.1:5001 via systemd). Same-origin,
# so no CORS is needed in production — FRONTEND_ORIGIN in backend/.env is
# only exercised during local dev where frontend and backend run on
# different ports.
#
# Install: sudo cp deploy/nginx-tharai.conf /etc/nginx/sites-available/tharai
#          sudo ln -s /etc/nginx/sites-available/tharai /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Then run certbot (see deploy/DEPLOY.md) — it edits this file in place to add SSL.

server {
    listen 80;
    server_name tharaiedutech.com www.tharaiedutech.com;

    root /var/www/tharaisite;
    index index.html;

    client_max_body_size 6M;

    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
