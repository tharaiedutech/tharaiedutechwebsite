<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 50px;
            background: #f3f4f6;
        }
        
        .logo {
            display: inline-block;
            background: white;
            padding: 20px 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .logo h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #1F2937;
            margin: 0;
            line-height: 1.2;
        }
        
        .logo h1 .ai-highlight {
            font-family: 'Courier New', monospace;
            font-weight: 900;
            color: #06B6D4;
        }
        
        .logo .tagline {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: #7C3AED;
            margin-top: 0.2rem;
            letter-spacing: 0.2em;
        }
    </style>
</head>
<body>
    <h2>Logo Test Page</h2>
    <p>Testing the THARAI EduTech logo:</p>
    
    <div class="logo">
        <h1>THAR<span class="ai-highlight">AI</span></h1>
        <span class="tagline">EduTech</span>
    </div>
    
    <hr style="margin: 40px 0;">
    
    <h3>Expected Result:</h3>
    <ul>
        <li>THARAI - with "AI" in cyan/blue color</li>
        <li>EduTech - in purple, below THARAI</li>
    </ul>
    
    <p><a href="index.html">Go to Main Page</a></p>
</body>
</html>
