<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - THARAI EduTech</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="icon" type="image/png" href="images/tharai-tree-logo.PNG">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar" style="background: white; border-bottom: 1px solid #E5E7EB; padding: 1rem 0;">
        <div class="nav-container" style="max-width: 1200px; margin: 0 auto; padding: 0 2rem;">
            <div class="logo-section">
                <a href="index.html" style="display: flex; align-items: center; text-decoration: none; gap: 0.75rem;">
                    <img src="images/tharai-tree-logo.PNG" alt="Tharai Logo" style="height: 50px; width: auto;">
                    <div style="display: flex; flex-direction: column;">
                        <span style="font-size: 1.5rem; font-weight: 700; color: #7C3AED; line-height: 1.2;">THARAI</span>
                        <span style="font-size: 0.875rem; font-weight: 600; color: #10B981; line-height: 1.2;">EduTech</span>
                    </div>
                </a>
            </div>
        </div>
    </nav>

    <!-- Reset Password Container -->
    <div class="auth-page-container">
        <div class="auth-page-content">
            <div class="auth-page-header">
                <h1>🔑 Reset Your Password</h1>
                <p>Enter your new password below</p>
            </div>

            <form id="resetPasswordForm" class="auth-page-form">
                <div class="form-group">
                    <label for="newPassword">New Password <span class="required">*</span></label>
                    <input type="password" id="newPassword" required placeholder="Enter new password" minlength="8">
                    <small>Minimum 8 characters</small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password <span class="required">*</span></label>
                    <input type="password" id="confirmPassword" required placeholder="Confirm new password" minlength="8">
                </div>

                <button type="submit" class="btn-auth-primary">
                    Reset Password
                </button>

                <div id="resetError" class="error-message" style="display: none; margin-top: 1rem;"></div>
                <div id="resetSuccess" class="success-message" style="display: none; margin-top: 1rem;"></div>
            </form>

            <div class="auth-page-footer">
                <p>Remember your password? <a href="index.html">Back to Login</a></p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="scripts/api-config.js?v=82.0"></script>

    <script>
        const resetToken = new URLSearchParams(window.location.search).get('token');
        const resetForm = document.getElementById('resetPasswordForm');

        if (!resetToken) {
            resetForm.style.display = 'none';
            const errorDiv = document.getElementById('resetError');
            errorDiv.textContent = 'This reset link is missing or invalid. Please request a new one from the login screen.';
            errorDiv.style.display = 'block';
        }

        // Handle password reset
        resetForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorDiv = document.getElementById('resetError');
            const successDiv = document.getElementById('resetSuccess');
            const submitBtn = e.target.querySelector('button[type="submit"]');

            // Hide previous messages
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            // Validate passwords match
            if (newPassword !== confirmPassword) {
                errorDiv.textContent = 'Passwords do not match';
                errorDiv.style.display = 'block';
                return;
            }

            // Validate password length
            if (newPassword.length < 8) {
                errorDiv.textContent = 'Password must be at least 8 characters';
                errorDiv.style.display = 'block';
                return;
            }

            // Disable button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Resetting...';

            try {
                const response = await fetch(`${API_BASE}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: resetToken, new_password: newPassword })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Error resetting password. Please try again.');

                // Success!
                successDiv.innerHTML = '✅ Password reset successful! Redirecting to login...';
                successDiv.style.display = 'block';

                // Redirect to home page after 2 seconds
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);

            } catch (error) {
                console.error('Password reset error:', error);
                errorDiv.textContent = error.message || 'Error resetting password. Please try again.';
                errorDiv.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Reset Password';
            }
        });
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .auth-page-container {
            min-height: calc(100vh - 85px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: linear-gradient(135deg, #F3E8FF 0%, #FCE7F3 100%);
        }

        .auth-page-content {
            background: white;
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(124, 58, 237, 0.15);
            max-width: 500px;
            width: 100%;
        }

        .auth-page-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-page-header h1 {
            color: #7C3AED;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .auth-page-header p {
            color: #6B7280;
            font-size: 1rem;
        }

        .auth-page-form {
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #374151;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .required {
            color: #EF4444;
        }

        .form-group input {
            width: 100%;
            padding: 0.875rem;
            border: 2px solid #E5E7EB;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #7C3AED;
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1);
        }

        .form-group small {
            display: block;
            margin-top: 0.5rem;
            color: #6B7280;
            font-size: 0.875rem;
        }

        .btn-auth-primary {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #7C3AED 0%, #A855F7 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
        }

        .btn-auth-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(124, 58, 237, 0.3);
        }

        .btn-auth-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-page-footer {
            text-align: center;
            padding-top: 1.5rem;
            border-top: 2px solid #E5E7EB;
        }

        .auth-page-footer p {
            color: #6B7280;
            font-size: 0.95rem;
        }

        .auth-page-footer a {
            color: #7C3AED;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-page-footer a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #FEE2E2;
            color: #991B1B;
            padding: 1rem;
            border-radius: 8px;
            border-left: 4px solid #EF4444;
            font-size: 0.95rem;
        }

        .success-message {
            background: #D1FAE5;
            color: #065F46;
            padding: 1rem;
            border-radius: 8px;
            border-left: 4px solid #10B981;
            font-size: 0.95rem;
        }
    </style>
</body>
</html>
