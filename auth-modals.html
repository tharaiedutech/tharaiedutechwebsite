<!-- Login Modal -->
<div id="loginModal" class="auth-modal">
    <div class="auth-modal-content">
        <div class="auth-modal-header">
            <h2>Welcome Back!</h2>
            <span class="close-auth-modal" onclick="closeLoginModal()">&times;</span>
        </div>
        <div class="auth-modal-body">
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="loginEmail">Email Address *</label>
                    <input type="email" id="loginEmail" required placeholder="your.email@example.com">
                </div>
                
                <div class="form-group">
                    <label for="loginPassword">Password *</label>
                    <input type="password" id="loginPassword" required placeholder="Enter your password">
                </div>
                
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>
                    <a href="#" onclick="showForgotPassword()" class="forgot-password">Forgot Password?</a>
                </div>
                
                <button type="submit" class="btn-auth-primary" id="loginSubmitBtn">
                    Login
                </button>

                <p class="auth-switch" style="text-align: center; color: #6B7280;">
                    📚 New here? <a href="courses.html" style="color: #7C3AED; font-weight: 600;">Browse Courses</a> and click "Enroll Now"<br>
                    <small style="font-size: 0.875rem;">Student accounts are created by admin after enrollment confirmation</small>
                </p>
            </form>
            
            <div id="loginError" class="error-message" style="display: none;"></div>
            <div id="loginSuccess" class="success-message" style="display: none;"></div>
        </div>
    </div>
</div>

<!-- Forgot Password Modal -->
<div id="forgotPasswordModal" class="auth-modal">
    <div class="auth-modal-content">
        <div class="auth-modal-header">
            <h2>Reset Password</h2>
            <span class="close-auth-modal" onclick="closeForgotPasswordModal()">&times;</span>
        </div>
        <div class="auth-modal-body">
            <p style="margin-bottom: 1.5rem; color: #6B7280;">
                Enter your email address and we'll send you a link to reset your password.
            </p>
            
            <form id="forgotPasswordForm" onsubmit="handleForgotPassword(event)">
                <div class="form-group">
                    <label for="resetEmail">Email Address *</label>
                    <input type="email" id="resetEmail" required placeholder="your.email@example.com">
                </div>
                
                <button type="submit" class="btn-auth-primary" id="resetSubmitBtn">
                    Send Reset Link
                </button>
                
                <p class="auth-switch">
                    Remember your password? 
                    <a href="#" onclick="switchToLogin()">Login</a>
                </p>
            </form>
            
            <div id="resetError" class="error-message" style="display: none;"></div>
            <div id="resetSuccess" class="success-message" style="display: none;"></div>
        </div>
    </div>
</div>

<!-- Auth Scripts -->
<script src="scripts/api-config.js"></script>
<script src="scripts/auth.js"></script>
<script src="scripts/auth-ui.js"></script>
